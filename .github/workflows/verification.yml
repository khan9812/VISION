name: Release verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU runtime and pinned SAM source
        run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python scripts/install_sam2.py
          python -m pip check
      - name: Test geometry, configuration and exports
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v
      - name: Recompute archived statistics
        run: python analysis/reproduce_results.py
      - uses: actions/upload-artifact@v4
        with:
          name: numeric-verification
          path: workspace_outputs/reproduction/numeric_verification.json
